name: Build TriggerBot 1.21.11
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: unzip -o $(ls *.zip | head -1) -x ".github/*"
      - name: Fix Loom
        run: sed -i 's/1.7-SNAPSHOT/1.14.10/g' build.gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle build --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TriggerBot-Jar
          path: build/libs/*.jar
