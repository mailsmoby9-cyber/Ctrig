name: Build TriggerBot 1.21.11
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unpack source zip
      run: |
        if ls *.zip >/dev/null 2>&1; then
          unzip -o *.zip -x ".github/*"
        fi

    - name: Fix Loom version for 1.21.11
      run: |
        if [ -f build.gradle ]; then
          sed -i "s/1.7-SNAPSHOT/1.14.10/g" build.gradle
        fi

    - name: Create Gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate gradlew
      run: gradle wrapper --gradle-version 8.10

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TriggerBot-Jar-1.21.11
        path: build/libs/*.jar
